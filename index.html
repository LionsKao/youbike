<meta property="og:type" content="website">

<meta property="og:url" content="https://youbike-6n2.pages.dev/">

<meta property="og:description" content="顯示鄰近 YouBike 站點即時車位與租借狀況，支援定位、QR Code 分享與一鍵導航到 Google Maps。">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="車輛查詢 - YouBike 即時站點查詢">
<meta name="twitter:description" content="顯示鄰近 YouBike 站點即時車位與租借狀況，支援定位、QR Code 分享與一鍵導航到 Google Maps。">

  crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="style.css?v=89">
</head>
<body>

<h1 class="visually-hidden">YouBike 車輛查詢</h1>
<p class="visually-hidden">顯示鄰近 YouBike 站點即時車位與租借狀況的網頁應用，支援定位、QR Code 分享與一鍵導航到 Google Maps。</p>

<svg style="position:absolute;width:0;height:0;visibility:hidden" aria-hidden="true">
  <filter id="fab-outline" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
    <feMorphology in="SourceAlpha" operator="dilate" radius="2" result="dilated" />
    <feFlood flood-color="#454545" result="color" />
    <feComposite in="color" in2="dilated" operator="in" result="stroke" />
    <feMerge>
      <feMergeNode in="stroke" />
      <feMergeNode in="SourceGraphic" />
    </feMerge>
  </filter>
</svg>

<div class="compass-modal-overlay" id="modalOverlay" style="display:none">
  <div class="compass-modal">
    <div class="compass-modal-title" id="modalTitle"></div>
    <div class="compass-modal-body" id="modalBody" style="display:none"></div>
    <div class="compass-modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="loading-state" id="loadingState"><i class="fa-solid fa-arrow-rotate-right"></i></div>

<h2 class="visually-hidden">附近站點列表</h2>
<div class="card-grid" id="cardGrid" style="display:none"></div>

<footer></footer>

<div class="fab-stack">
  <span class="tooltip-wrap" id="qrCodeBtnWrap">
    <span class="hint-tooltip qr-tooltip" id="qrCodeTooltip"><img src="icons/qrcode.png" width="132" height="132" alt="網站 QR Code"></span>
    <button type="button" class="fab-btn fab-qrcode" id="qrCodeBtn" aria-label="顯示 QR Code" title="顯示 QR Code">
      <i class="fa-solid fa-qrcode"></i>
      <span class="visually-hidden">顯示 QR Code</span>
    </button>
  </span>
  <button type="button" class="fab-btn fab-openapp" id="openAppBtn" aria-label="開啟 YouBike App" title="開啟 YouBike App">
    <i class="fa-solid fa-person-biking"></i>
    <span class="visually-hidden">開啟 YouBike App</span>
  </button>
  <button type="button" class="fab-btn fab-location" id="fabLocation" aria-label="重新取得定位" title="重新取得定位">
    <i class="fa-solid fa-arrows-rotate"></i>
    <span class="visually-hidden">重新取得定位</span>
  </button>
  <button type="button" class="fab-btn fab-navigate" id="fabNavigate" aria-label="在 Google Maps 開啟站點" title="在 Google Maps 開啟站點">
    <i class="fa-solid fa-location-dot"></i>
    <span class="visually-hidden">在 Google Maps 開啟站點</span>
  </button>
</div>

<div class="fab-stack fab-stack-left">
  <button type="button" class="fab-btn fab-debug-fake" id="fabDebugFake" aria-label="假定位到萬華266號綠地" title="假定位到萬華266號綠地">
    <i class="fa-solid fa-tree"></i>
  </button>
</div>

<script src="script.js?v=87"></script>
</body>
</html>
